# Litmus CI: unit tests on every push, a device run only where a device exists.
#
# Read this before copying it into a repo:
#
#  * `unit` runs on a GitHub-hosted runner: lint + the device-free test suite.
#    It needs no emulator, no secrets and finishes in about a minute.
#  * `run-test` talks to a Litmus control plane that owns the emulator, proxy
#    and AVD, so it is pinned to `self-hosted` labels and gated on the
#    repository variable `LITMUS_DEVICE_CI=true`. A job pinned to a label nobody
#    registered does not fail, it queues silently, so the gate matters: with the
#    variable unset the job is skipped, not queued. Register a runner with
#    `self-hosted, windows, android-emulator` to use it.
#  * The device job is **API-trigger only**: it never drives adb itself. CI
#    talks to the control plane, which owns the device.
#  * Set `LITMUS_API_URL` and (when `API_TOKEN` is set on the server)
#    `LITMUS_API_TOKEN` as repository secrets. No secret ever appears in a log.
#  * A run takes minutes, so the job starts it and polls the report endpoint
#    until the run is terminal.
name: litmus

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: Path to the APK on the runner (or an artifact path)
        required: true
        default: artifacts/app-debug.apk
      profile:
        description: Litmus profile name
        required: false
        default: bazaar
      steps:
        description: Explore step budget
        required: false
        default: "25"
  push:
    branches: [main]

concurrency:
  group: litmus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: lint + unit tests (no device)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        # Every test is device-free: the device, proxy and LLM modules are
        # imported lazily, so the suite runs on a plain runner.
        #
        # The tail of the run is copied into the step summary on purpose: a
        # failed job's log needs an authenticated download, the summary does not,
        # so a red build explains itself to anyone who opens the run page.
        shell: pwsh
        run: |
          python -m pytest -q --tb=short *> pytest.log
          $code = $LASTEXITCODE
          $tail = Get-Content pytest.log -Tail 60
          $tail | Out-Host
          if ($code -ne 0) {
            # Annotations and the step summary are readable without an
            # authenticated log download, so a red build explains itself.
            $tail | Select-String -Pattern '^FAILED\s' | Select-Object -First 10 | ForEach-Object {
              Write-Output "::error::$($_.Line)"
            }
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $tail | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          exit $code

  run-test:
    name: litmus run on a device (self-hosted)
    # Skipped unless a runner with these labels exists and the repo opts in.
    if: vars.LITMUS_DEVICE_CI == 'true'
    runs-on: [self-hosted, windows, android-emulator]
    timeout-minutes: 45
    env:
      LITMUS_API_URL: ${{ secrets.LITMUS_API_URL }}
      LITMUS_API_TOKEN: ${{ secrets.LITMUS_API_TOKEN }}
      APK_PATH: ${{ inputs.apk_path || 'artifacts/app-debug.apk' }}
      PROFILE: ${{ inputs.profile || 'bazaar' }}
      STEPS: ${{ inputs.steps || '25' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the control plane is up
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "$env:LITMUS_API_URL/health" -TimeoutSec 10
          if (-not $health.ok) { throw "Litmus API is not healthy" }

      - name: Upload the APK as a target
        id: target
        shell: pwsh
        run: |
          $headers = @{}
          if ($env:LITMUS_API_TOKEN) { $headers["X-Litmus-Token"] = $env:LITMUS_API_TOKEN }
          $form = @{
            file    = Get-Item $env:APK_PATH
            profile = $env:PROFILE
          }
          $target = Invoke-RestMethod -Method Post -Uri "$env:LITMUS_API_URL/v1/targets" `
            -Headers $headers -Form $form -TimeoutSec 300
          "target_id=$($target.id)" >> $env:GITHUB_OUTPUT

      - name: Start the run
        id: run
        shell: pwsh
        run: |
          $headers = @{ "Content-Type" = "application/json" }
          if ($env:LITMUS_API_TOKEN) { $headers["X-Litmus-Token"] = $env:LITMUS_API_TOKEN }
          $body = @{
            target_id = "${{ steps.target.outputs.target_id }}"
            profile   = $env:PROFILE
            steps     = [int]$env:STEPS
            verify    = $true
          } | ConvertTo-Json
          $run = Invoke-RestMethod -Method Post -Uri "$env:LITMUS_API_URL/v1/runs" `
            -Headers $headers -Body $body -TimeoutSec 60
          "run_id=$($run.run.id)" >> $env:GITHUB_OUTPUT

      - name: Wait for the verdict
        shell: pwsh
        run: |
          $headers = @{}
          if ($env:LITMUS_API_TOKEN) { $headers["X-Litmus-Token"] = $env:LITMUS_API_TOKEN }
          $url = "$env:LITMUS_API_URL/v1/runs/${{ steps.run.outputs.run_id }}"
          $terminal = @("done", "failed", "cancelled")
          for ($i = 0; $i -lt 120; $i++) {
            $state = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 30
            Write-Host "status: $($state.run.status)"
            if ($terminal -contains $state.run.status) { break }
            Start-Sleep -Seconds 15
          }
          if ($state.run.status -ne "done") { throw "run did not finish: $($state.run.status)" }

      - name: Fail the job when a bug was confirmed
        shell: pwsh
        run: |
          $headers = @{}
          if ($env:LITMUS_API_TOKEN) { $headers["X-Litmus-Token"] = $env:LITMUS_API_TOKEN }
          $report = Invoke-RestMethod `
            -Uri "$env:LITMUS_API_URL/v1/runs/${{ steps.run.outputs.run_id }}/report" `
            -Headers $headers -TimeoutSec 60
          $confirmed = @($report.findings | Where-Object { $_.verdict -eq "confirmed" })
          $confirmed | ForEach-Object { Write-Host "$($_.kind)  $($_.signature)" }
          Write-Host "confirmed: $($confirmed.Count)"
          if ($confirmed.Count -gt 0) {
            # A red build is the point of the gate: the app failed its litmus test.
            throw "$($confirmed.Count) confirmed finding(s) - see the report URL in the summary"
          }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $url = "$env:LITMUS_API_URL/runs/${{ steps.run.outputs.run_id }}"
          "Litmus report: $url" >> $env:GITHUB_STEP_SUMMARY
